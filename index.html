<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>칠복이네 3D</title>
<script>window.IS3D = true;</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --ink:#3a3138; --ink2:#6e6268; --cream:#fffcf7; --paper:#f4ece0; --line:#e8ddd0;
  --accent:#e9826b; --accent-d:#c9604a; --mint:#7fbfa3; --sky:#8fc9e8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#231a16;font-family:'Galmuri11','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:transparent}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.box{background:rgba(255,252,247,.96);backdrop-filter:blur(6px);border:2px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink),0 14px 30px rgba(20,12,8,.28)}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;box-shadow:0 2px 0 var(--ink);white-space:nowrap;transition:transform .06s,box-shadow .06s,background .15s}
button:hover{background:#f9efe2}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
button.primary{background:var(--accent);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#f48f6c}
button.small{font-size:11px;padding:4px 8px;box-shadow:0 2px 0 var(--ink)}
button.danger{background:#f7d6cd}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:2px solid var(--ink2);border-radius:8px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(239,125,87,.2)}
.hidden{display:none!important}

#hud-tl{position:fixed;left:14px;top:14px;padding:12px 14px 10px;width:230px;font-size:12px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:2px dashed var(--line)}
.brand canvas{width:32px;height:32px}
.brand .t{font-family:'Galmuri14','Galmuri11',sans-serif;font-size:17px;font-weight:bold;letter-spacing:1px}
.brand .s{font-size:10px;opacity:.6;margin-top:2px}
#online .who{display:flex;gap:7px;align-items:center;padding:3px 4px;border-radius:6px;white-space:nowrap;overflow:hidden}
#online .who:hover{background:rgba(239,125,87,.08)}
#online .who canvas{width:28px;height:24px;flex:none;background:#f3e3c6;border-radius:6px}
#online .who .nm{font-weight:bold;overflow:hidden;text-overflow:ellipsis}
#online .who .where{opacity:.5;font-size:10px;overflow:hidden;text-overflow:ellipsis}
#online .who .col{display:flex;flex-direction:column;min-width:0;line-height:1.35}
#online .foot{margin-top:6px;font-size:10px;opacity:.55;text-align:right}

#toolbar{position:fixed;right:14px;top:14px;display:flex;align-items:stretch;gap:2px;padding:5px}
.tb{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:50px;padding:5px 6px 4px;font-size:10px;background:transparent;border:none;box-shadow:none;border-radius:8px;position:relative}
.tb .i{font-size:18px;line-height:22px}
.tb:hover{background:#f4ebdf}
.tb:active{transform:translateY(1px);box-shadow:none}
.tb.on{background:var(--accent);color:#fff}
.sep{width:2px;margin:6px 3px;background:var(--line);border-radius:2px}
.badge{position:absolute;top:1px;right:5px;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;background:#e8574f;color:#fff;font-size:10px;font-weight:bold;box-shadow:0 0 0 2px #fff}

#chatbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(600px,calc(100vw - 28px));padding:8px}
#emotes{display:flex;gap:4px;margin-bottom:6px}
#emotes button{flex:1;padding:3px 0;font-size:17px;background:#fff;border:2px solid var(--line);box-shadow:none;border-radius:8px}
#emotes button:hover{border-color:var(--accent);background:#fff5ef;transform:translateY(-2px)}
.inrow{display:flex;gap:6px;align-items:center}
.inrow input{flex:1;min-width:0}
#meAvatar{width:34px;height:29px;flex:none;background:#f3e3c6;border:2px solid var(--line);border-radius:8px}

#log{position:fixed;right:14px;top:90px;width:280px;max-height:calc(100vh - 250px);overflow:auto;padding:10px 12px;font-size:12px;display:none}
#log.show{display:block}
#log h3{margin:0 0 6px;font-size:13px}
#log .m{padding:6px 2px;border-bottom:1px dashed var(--line);word-break:break-all;-webkit-user-select:text;user-select:text;line-height:1.5}
#log .m b{margin-right:5px;color:var(--accent-d)}
#log .m time{opacity:.4;font-size:10px;margin-left:5px}

#palette{position:fixed;right:14px;top:84px;width:min(600px,calc(100vw - 28px));padding:10px;display:none;z-index:6}
#palette.show{display:flex;gap:10px}
#pmain{flex:1;min-width:0}
#ptools{display:flex;flex-direction:column;gap:6px;padding-right:10px;border-right:1px dashed var(--line)}
#ptools .pt{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:7px 2px 6px;font-size:11px;background:#f7f1e8;border:2px solid transparent;box-shadow:none;border-radius:12px}
#ptools .pt .i{font-size:20px;line-height:22px}
#ptools .pt:hover{border-color:#d9b98c}
#ptools .pt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#ptools .ptl{font-size:10px;opacity:.6;text-align:center;margin-bottom:-2px}
#tabs button.dim{background:#efe7dc;border-color:#d9cfc2}
#items.dim{opacity:.55}
#items.dim:hover{opacity:.85}
#variants .vt{font-size:12px;white-space:nowrap}
#tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
#tabs button{padding:5px 10px;font-size:12px;box-shadow:none;border-radius:20px;background:#fff;border-color:var(--line)}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));grid-auto-rows:min-content;align-content:start;gap:6px;height:160px;overflow:auto;padding:2px}
.it{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px 5px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-size:10px;background:#fff;text-align:center;transition:transform .08s,border-color .1s}
.it:hover{transform:translateY(-2px);border-color:#d9b98c}
.it .ic{font-size:24px;line-height:36px;height:36px;display:flex;align-items:center;justify-content:center}
.it.sel{border-color:var(--accent);background:#fff1ea;box-shadow:0 0 0 2px rgba(239,125,87,.25)}
.it canvas{width:40px;height:40px}
#variants{display:flex;align-items:center;align-content:center;gap:4px 4px;flex-wrap:wrap;overflow:hidden;height:86px;box-sizing:border-box;margin-bottom:8px;padding:6px 8px;background:#f7f1e8;border-radius:10px}
#variants.hidden{display:flex!important;visibility:hidden}
#variants .vl{font-size:11px;opacity:.7;margin-right:4px;white-space:nowrap;flex:none}
.rotrow{display:flex;align-items:center;gap:6px;flex:none;width:100%}
.rotprev{width:32px;height:32px;background:#fff;border:2px solid var(--line);border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.rotprev canvas{width:28px;height:28px}
#variants .vb{padding:2px;background:#fff;border:2px solid var(--line);box-shadow:none;border-radius:8px;line-height:0}
#variants .vb canvas{width:28px;height:28px}
#variants .vb.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(233,130,107,.25)}
.look-tabs{display:flex;gap:4px;margin:4px 0 10px}
.look-tabs button{flex:1;padding:6px 4px;font-size:12px;box-shadow:none;border-radius:10px;background:#fff;border-color:var(--line)}
.look-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#hint{font-size:11px;margin-top:8px;opacity:.75;line-height:1.5;height:33px;overflow:hidden}

.modal-bg{position:fixed;inset:0;background:rgba(30,18,10,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
.modal-bg.show{display:flex}
.modal{padding:20px;width:min(470px,100%);max-height:calc(100vh - 28px);overflow:auto}
.modal.wide{width:min(640px,100%)}
.modal h2{margin:0 0 12px;font-size:17px;font-family:'Galmuri14','Galmuri11',sans-serif}
.row{display:flex;gap:8px;align-items:center;margin:9px 0;flex-wrap:wrap}
.row>label{width:60px;font-size:12px;flex:none;opacity:.8}
.err{color:#c0392b;font-size:12px;min-height:16px;margin-top:6px;line-height:1.5}
.sw{width:26px;height:26px;border:2px solid var(--ink);border-radius:7px;cursor:pointer;padding:0;box-shadow:none}
.sw:hover{transform:scale(1.1)}
.sw.sel{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chips button{padding:4px 9px;font-size:12px;box-shadow:none;border-radius:20px;background:#fff;border-color:var(--line)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.preview-wrap{display:flex;gap:14px;align-items:center;background:linear-gradient(#f3eadb 0,#f3eadb 58%,#c9a982 58%,#c9a982 64%,#d9b48c 64%);border:2px solid var(--ink);border-radius:12px;padding:10px 16px;margin-bottom:6px}
#preview{width:120px;height:165px}
.pv{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.pv span{font-size:10px;opacity:.6}
.pv.small canvas{width:85px;height:117px}
#previewSpin{background:rgba(255,255,255,.35);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:middle}
td select{font-size:12px;padding:4px}
.sec{margin:18px 0 8px;font-size:13px;font-weight:bold;border-top:2px solid var(--line);padding-top:12px}
.muted{font-size:11px;opacity:.65;line-height:1.55}

#loginModal{background:radial-gradient(ellipse at center,rgba(42,28,20,.15) 0%,rgba(42,28,20,.7) 100%)}
.login-card{padding:24px 24px 20px;width:min(410px,100%)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo canvas{width:48px;height:48px}
.logo h1{margin:0;font-family:'Galmuri14','Galmuri11',sans-serif;font-size:28px;letter-spacing:2px;line-height:1}
.logo .sub{font-size:11px;opacity:.6;margin-top:6px}
.family{background:linear-gradient(#f3eadb 0,#f3eadb 55%,#c9a982 55%,#c9a982 62%,#d9b48c 62%);border:2px solid var(--ink);border-radius:12px;padding:8px 6px 4px;margin-bottom:10px;text-align:center}
#family{width:100%;max-width:420px;height:auto;aspect-ratio:700/190}
.newbox{background:#fff;border:2px dashed var(--accent);border-radius:10px;padding:12px;margin-top:10px;font-size:12px;line-height:1.6}

.board-modal{width:min(520px,100%);background:linear-gradient(180deg,#fffdf7,#fbf0da)}
.board-write{background:#c99a62;border:3px solid #7a4e2d;border-radius:10px;padding:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.board-write textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:#fffdf3;border:2px solid #7a4e2d;border-radius:6px;padding:8px 10px;resize:vertical;outline:none}
.board-write .muted{color:#fff;opacity:.85}
#boardList{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.note{position:relative;background:#fff8c9;border:2px solid #e3cf7a;border-radius:4px;padding:10px 12px 8px;box-shadow:2px 3px 0 rgba(63,43,31,.15);font-size:13px;line-height:1.55;word-break:break-all;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.note:nth-child(3n+2){background:#e4f4ff;border-color:#a9d3ef}
.note:nth-child(3n){background:#ffe8ef;border-color:#f1b5c7}
.note.pinned{background:#fff1d6;border-color:var(--accent);box-shadow:0 0 0 2px rgba(239,125,87,.25),2px 3px 0 rgba(63,43,31,.15)}
.note .meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;opacity:.75;white-space:normal}
.note .meta b{color:var(--accent-d)}
.note .meta .sp{flex:1}
.note .pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:16px}
#demo{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#ffe08a;padding:6px 12px;font-size:11px;display:none;z-index:15;max-width:56vw;text-align:center;border-radius:10px}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  #hud-tl{width:auto;max-width:44vw;padding:8px 10px;font-size:11px}
  #online .who canvas{display:none}
  .brand .s{display:none}
  #toolbar{max-width:52vw;flex-wrap:wrap;justify-content:flex-end}
  .tb{min-width:38px;font-size:0;padding:5px 4px}
  .tb .i{font-size:17px}
  .sep{display:none}
  #log{width:calc(100vw - 28px);top:auto;bottom:130px}
  #palette{right:8px;width:calc(100vw - 16px)}
  #ptools .pt{width:46px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="game"></canvas>
<div id="demo" class="box"></div>

<div id="hud-tl" class="box hidden">
  <div class="brand"><canvas id="brandIcon" class="px" width="16" height="16"></canvas><div><div class="t">칠복이네</div><div class="s" id="clock"></div></div></div>
  <div id="online"></div>
</div>

<div id="toolbar" class="box hidden">
  <button class="tb" id="bLook" title="캐릭터 꾸미기"><span class="i">😊</span>캐릭터</button>
  <button class="tb" id="bEdit" title="집 꾸미기 (E)"><span class="i">🎨</span>꾸미기</button>
  <button class="tb" id="bLog" title="대화 기록"><span class="i">💬</span>대화<span id="unread"></span></button>
  <button class="tb" id="bBoard" title="거실 게시판"><span class="i">📌</span>게시판<span id="boardBadge"></span></button>
  <span class="sep"></span>
  <button class="tb" id="bMyRoom" title="내 방으로 이동"><span class="i">🛏️</span>내 방</button>
  <button class="tb" id="bLiving" title="거실로 이동"><span class="i">🛋️</span>거실</button>
  <span class="sep"></span>
  <button class="tb" id="bZoomOut" title="축소"><span class="i">➖</span>축소</button>
  <button class="tb" id="bZoomIn" title="확대"><span class="i">➕</span>확대</button>
  <button class="tb" id="bFit" title="집 전체 보기"><span class="i">🗺️</span>전체</button>
  <button class="tb" id="bRotL" title="왼쪽으로 돌리기 (Z)"><span class="i">↺</span>회전</button>
  <button class="tb" id="bRotR" title="오른쪽으로 돌리기 (X)"><span class="i">↻</span>회전</button>
  <button class="tb" id="bRotReset" title="처음 방향으로 (C)"><span class="i">🧭</span>원위치</button>
  <span class="sep"></span>
  <button class="tb hidden" id="bAdmin" title="관리자"><span class="i">👑</span>관리</button>
  <button class="tb" id="bOut" title="나가기"><span class="i">🚪</span>나가기</button>
</div>

<div id="log" class="box"></div>

<div id="palette" class="box">
  <div id="ptools"></div>
  <div id="pmain">
    <div id="tabs"></div>
    <div id="variants" class="hidden"></div>
    <div id="items"></div>
    <div id="hint"></div>
  </div>
</div>

<div id="chatbar" class="box hidden">
  <div id="emotes"></div>
  <div class="inrow">
    <canvas id="meAvatar" class="px" width="14" height="12"></canvas>
    <input id="chatIn" maxlength="120" placeholder="Enter 눌러서 말하기 · 방향키/WASD 이동 · 바닥 클릭으로도 이동" autocomplete="off">
    <button id="bSend" class="primary">전송</button>
  </div>
</div>

<div id="loginModal" class="modal-bg show">
  <div class="modal box login-card">
    <div class="logo"><canvas id="logoHouse" class="px" width="16" height="16"></canvas><div><h1>칠복이네</h1><div class="sub">일곱 명의 복 있는 집에 오신 걸 환영해요</div></div></div>
    <div class="family"><canvas id="family" class="px" width="112" height="26"></canvas></div>
    <div class="muted" id="slotInfo">집 문 여는 중…</div>
    <div class="row"><label>아이디</label><input id="inId" maxlength="12" placeholder="영문/한글/숫자 2~12자" style="flex:1"></div>
    <div class="row"><label>비밀번호</label><input id="inPin" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" style="flex:1"></div>
    <div id="newBox" class="newbox hidden">
      <span id="newMsg"></span>
      <div class="row" style="margin-bottom:0"><button id="bCreate" class="primary">새로 만들기</button><button id="bCancelNew">다시 입력</button></div>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="row" style="margin-bottom:0"><button id="bLogin" class="primary" style="flex:1;padding:11px">🏠 집에 들어가기</button></div>
  </div>
</div>

<div id="lookModal" class="modal-bg">
  <div class="modal box">
    <h2>😊 내 캐릭터 · 닉네임</h2>
    <div class="preview-wrap">
      <div class="pv"><canvas id="preview" class="px" width="14" height="22"></canvas><span>정면</span></div>
      <div class="pv small"><canvas id="previewSpin" class="px" width="14" height="22"></canvas><span>돌려보기</span></div>
      <div class="muted" style="opacity:.8">저장하면 다음에 들어와도 그대로 남아요.<br>어느 기기에서 들어와도 같은 캐릭터예요.</div>
    </div>
    <div class="row"><label>닉네임</label><input id="inNick" maxlength="10" placeholder="화면에 보일 이름 (최대 10자)" style="flex:1"></div>
    <div class="muted" style="margin:-4px 0 4px 68px">이모지·띄어쓰기도 돼요. 비워두면 아이디가 보여요.</div>
    <div id="lookOpts"></div>
    <div class="row" style="justify-content:space-between;margin-bottom:0">
      <button id="bRandom">🎲 랜덤</button>
      <span><button id="bLookCancel">닫기</button> <button id="bLookSave" class="primary">저장</button></span>
    </div>
  </div>
</div>

<div id="boardModal" class="modal-bg">
  <div class="modal box board-modal">
    <div class="row" style="justify-content:space-between;margin-top:0"><h2 style="margin:0">📌 거실 게시판</h2><button id="bBoardClose">닫기</button></div>
    <div class="muted" style="margin-bottom:8px">누구나 글을 남길 수 있어요. 내 글은 내가 지울 수 있고, 📍 고정은 관리자만 할 수 있어요.</div>
    <div class="board-write">
      <textarea id="boardIn" maxlength="300" rows="3" placeholder="공지, 약속, 하고 싶은 말을 남겨 보세요 (최대 300자)"></textarea>
      <div class="row" style="justify-content:space-between;margin:6px 0 0"><span class="muted" id="boardCount">0/300</span><button id="bBoardPost" class="primary">📝 올리기</button></div>
    </div>
    <div id="boardList"></div>
  </div>
</div>

<div id="adminModal" class="modal-bg">
  <div class="modal box wide">
    <div class="row" style="justify-content:space-between;margin-top:0"><h2 style="margin:0">👑 관리자</h2><button id="bAdminClose">닫기</button></div>
    <div id="adminBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =====================================================================

    if (top) { const b = furniture[tileKey(x, y)]; const bd = b && ITEM[b.k]; lift = bd && bd.surf ? bd.surf * SURF3 + (bd.surf > 20 ? .05 : 0) : 0; }

      if (e) G3.scene.remove(e.obj);

      if (d.wall) obj.position.set(x, WALL_ITEM_Y, y + 1.001); else obj.position.set(x, lift, y);

/* ---------------- 채팅 ---------------- */
function genKey(){ return Date.now().toString(36).padStart(9, '0') + Math.random().toString(36).slice(2, 6); }
function postChat(text){
  if (!text || !me) return;
  Store.set('chat/' + genKey(), { id: me.id, text, t: Date.now() });
  const keys = Object.keys(chat).sort();
  if (keys.length > 120) { const o = {}; keys.slice(0, keys.length - 100).forEach(k => o['chat/' + k] = null); Store.update(o); }
}
function sendChat(){
  const inp = $('chatIn'), text = inp.value.trim();
  inp.value = ''; inp.blur();
  postChat(text);
}
$('chatIn').addEventListener('keydown', e => {
  if (e.key === 'Enter') { if (e.isComposing || e.keyCode === 229) return; e.preventDefault(); sendChat(); }
  if (e.key === 'Escape') $('chatIn').blur();
});
$('bSend').onclick = sendChat;
EMOTES.forEach(em => { const b = document.createElement('button'); b.textContent = em; b.title = '이모티콘 보내기'; b.onclick = () => postChat(em); $('emotes').appendChild(b); });
function onChat(val){
  chat = val || {};
  const keys = Object.keys(chat).sort();
  if (lastChatKey === null) lastChatKey = keys[keys.length - 1] || '';
  else {
    for (const k of keys) if (k > lastChatKey) {
      const m = chat[k]; if (!m) continue;
      const text = String(m.text || ''), emote = EMOJI_ONLY.test(text);
      bubbles[m.id] = { text, emote, start: Date.now(), until: Date.now() + (emote ? 2600 : Math.min(9000, 4000 + text.length * 120)) };
      if (!$('log').classList.contains('show') && m.id !== me?.id) unread++;
    }
    if (keys.length && keys[keys.length - 1] > lastChatKey) lastChatKey = keys[keys.length - 1];
  }
  renderLog(keys); renderUnread();
}
function renderLog(keys){
  const log = $('log'); log.innerHTML = '';
  const title = document.createElement('h3'); title.textContent = '💬 대화 기록'; log.appendChild(title);
  keys = keys || Object.keys(chat).sort();
  if (!keys.length) { const e = document.createElement('div'); e.className = 'muted'; e.textContent = '아직 대화가 없어요. 첫 마디를 건네 보세요!'; log.appendChild(e); }

/* ---------------- 거실 게시판 ---------------- */
const seenKey = () => 'board-seen-' + (me?.id || '');

  const rooms = [[3,3,11,10],[13,3,21,10],[23,3,31,10],[33,3,42,10],[3,22,11,28],[13,22,21,28],[33,22,42,28]].map(v => R(...v));

function oldAreaAt(x, y){
  const inR = r => x >= r.x1 && x <= r.x2 && y >= r.y1 && y <= r.y2;
  for (let i = 0; i < 7; i++) if (inR(OLD_AREAS.rooms[i])) return 'r' + i;
  if (inR(OLD_AREAS.foyer)) return 'foyer';

  if (!inR(OLD_AREAS.house)) return 'yard';

      if (f[k + '_t']) { o['furniture/' + k + '_t'] = null; o['furniture/' + tileKey(x, y + 1) + '_t'] = f[k + '_t']; }
    }
  }
  const r = await Store.get('rugs') || {};
  for (const k in r) { const { x, y } = parseKey(k); if (tileAt(x, y) === T.FACE) o['rugs/' + k] = null; }
  if (Object.keys(o).length) await Store.update(o);
}

const ID_RE = /^[a-zA-Z0-9가-힣_]{2,12}$/;
let pendingNew = null;
let slotTry = 0;
async function refreshSlots(){
  let u;
  try { u = await Store.get('users') || {}; }
  catch (e) {
    slotTry++;
    if (/TIMEOUT/.test(String(e && e.message || e)) && slotTry < 6) { $('slotInfo').textContent = `집 문 여는 중… (연결 다시 시도 ${slotTry})`; setTimeout(refreshSlots, 1500); return; }
    $('slotInfo').textContent = ''; $('loginErr').textContent = explainError(e); return;
  }
  slotTry = 0; $('loginErr').textContent = '';
  loginUsers = u;
  const n = Object.keys(u).length;
  $('slotInfo').textContent = n >= MAX_USERS ? `가족 ${n}/${MAX_USERS}명 · 자리가 다 찼어요 (기존 아이디로만 입장 가능)` : `가족 ${n}/${MAX_USERS}명 · 처음이면 원하는 아이디와 숫자 4자리를 정해서 들어오세요.`;
}
async function tryLogin(){
  const id = $('inId').value.trim(), pin = $('inPin').value.trim(), err = $('loginErr');
  err.textContent = ''; $('newBox').classList.add('hidden');
  if (!ID_RE.test(id)) return err.textContent = '아이디는 영문/한글/숫자 2~12자로 해 주세요.';
  if (!/^\d{4}$/.test(pin)) return err.textContent = '비밀번호는 숫자 4자리예요.';
  const h = await pinHash(id, pin);
  const u = await Store.get('users/' + id);
  if (u) { if (u.pin !== h) return err.textContent = '비밀번호가 맞지 않아요.'; return enter(id, h, false); }
  const all = await Store.get('users') || {};
  if (Object.keys(all).length >= MAX_USERS) return err.textContent = `가족 ${MAX_USERS}명이 다 찼어요. 아이디를 다시 확인해 주세요.`;
  pendingNew = { id, h };
  $('newMsg').textContent = `"${id}"는 처음 보는 아이디예요. 이 아이디와 비밀번호로 새로 만들까요? 비밀번호는 잊지 않게 기억해 두세요.`;
  $('newBox').classList.remove('hidden');
}
async function createUser(){
  if (!pendingNew) return;
  const { id, h } = pendingNew; pendingNew = null; $('newBox').classList.add('hidden');
  const all = await Store.get('users') || {};
  if (all[id]) return $('loginErr').textContent = '방금 누가 같은 아이디를 만들었어요. 다시 시도해 주세요.';
  if (Object.keys(all).length >= MAX_USERS) return $('loginErr').textContent = '자리가 다 찼어요.';
  const used = new Set(Object.values(all).map(x => x.room));

}
const safe = fn => async () => { try { await fn(); } catch (e) { $('loginErr').textContent = explainError(e); } };
$('bLogin').onclick = safe(tryLogin);

let subscribed = false, boardLoaded = false;
async function enter(id, h, isNew){
  try { sess().setItem('our-house-session', JSON.stringify({ id, h })); } catch(e) {}
  isAdmin = id === ADMIN_ID;
  users = await Store.get('users') || {};
  const room = users[id]?.room ?? -1;
  const [sx, sy] = room >= 0 ? roomCenter(room) : LIVING_SPOT;
  me = { id, x: sx, y: sy, fx: sx, fy: sy, dx: sx, dy: sy, d:'d', moving:false, ms:0, path:[] };
  $('loginModal').classList.remove('show');
  ['hud-tl','toolbar','chatbar'].forEach(x => $(x).classList.remove('hidden'));
  $('bAdmin').classList.toggle('hidden', !isAdmin);
  try { await migrateV2(); } catch(e) { console.warn('migrateV2', e); }
  subscribe();
  Store.onConnected(c => { if (c && me) { Store.onDisconnectRemove('presence/' + me.id); sendPresence(); } });
  setInterval(sendPresence, 10000);
  setInterval(renderOnline, 1000); renderOnline();
  layerDirty = true;
  if (isNew) { openLook(); toast(`🎉 환영해요, ${id}님! ${room >= 0 ? (room + 1) + '번 방이 내 방이에요.' : ''}`); }
  else toast(`🏠 어서 와요, ${nick(id)}님!`);
}
function subscribe(){
  if (subscribed) return; subscribed = true;
  Store.on('users', v => {
    users = v || {}; layerDirty = true;
    if (me && !users[me.id]) { alert('계정이 삭제되었어요.'); try { sess().removeItem('our-house-session'); } catch(e) {} location.reload(); return; }
    if ($('adminModal').classList.contains('show') && !document.activeElement?.closest?.('#adminModal')) renderAdmin();
    if (editing) buildPalette();
  });
  Store.on('presence', v => {
    presence = v || {}; const now = Date.now();
    for (const id in presence) {
      if (id === me.id) continue;
      const p = presence[id]; if (!p) continue;
      let o = others[id];
      if (!o) o = others[id] = { id, x: p.x, y: p.y, dx: p.x, dy: p.y, d: p.d || 'd', step: 0, seen: now, t: p.t, visible: true };
      if (o.t !== p.t || o.x !== p.x || o.y !== p.y) o.seen = now;
      o.x = p.x; o.y = p.y; o.d = p.d || 'd'; o.t = p.t;
    }
    for (const id in others) if (!presence[id]) delete others[id];
  });
  Store.on('furniture', v => { furniture = v || {}; layerDirty = true; });
  Store.on('rugs', v => { rugs = v || {}; layerDirty = true; });
  Store.on('tiles', v => { tiles = v || {}; layerDirty = true; });
  Store.on('roomNames', v => {
    roomNames = v || {}; layerDirty = true;
    const before = notices; notices = roomNames.board || {}; renderBoardBadge();
    if ($('boardModal').classList.contains('show')) { renderBoard(); markBoardSeen(); }
    if (boardLoaded) for (const k in notices) if (!before[k] && notices[k] && notices[k].id !== me.id) toast(`📌 ${nick(notices[k].id)}님이 게시판에 새 글을 올렸어요`);
    boardLoaded = true;
  });
  Store.on('chat', onChat);

  if (isAdmin) Store.on('backups', v => { backups = v || {}; if ($('adminModal').classList.contains('show')) renderAdmin(); });
}

/* ---------- 3D 초상화: 꾸미기 미리보기, 로그인 가족 사진, 접속자 얼굴 ---------- */
PREVIEW_MS = 40;
const PR = { r: null, scene: null, cam: null, objs: new Map(), bmp: new Map() };
function prReady(){
  if (PR.r) return true;
  if (!THREE || !RoundedBoxGeometry) return false;
  PR.r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  PR.r.setPixelRatio(1); PR.r.outputColorSpace = THREE.SRGBColorSpace;
  PR.scene = new THREE.Scene();
  PR.scene.add(new THREE.HemisphereLight('#ffffff', '#e8d6c2', 1.7));
  const d = new THREE.DirectionalLight('#fff3e2', 1.5); d.position.set(1.5, 3, 4); PR.scene.add(d);
  PR.cam = new THREE.PerspectiveCamera(26, 1, .1, 20);
  return true;
}
function prObj(look){
  const k = JSON.stringify(look || {});
  let o = PR.objs.get(k);
  if (!o) { o = avatar3D(look, true); PR.objs.set(k, o); if (PR.objs.size > 24) { const f = PR.objs.keys().next().value; PR.objs.delete(f); } }
  return o;
}
// mode: 'full' 전신 / 'head' 얼굴
function prRender(look, w, h, mode = 'full', yaw = 0, walk = -1){
  if (!prReady()) return null;
  const o = prObj(look), ud = o.userData;
  PR.scene.add(o); o.rotation.y = yaw;
  const ph = walk;
  ud.body.position.y = walk >= 0 ? Math.abs(Math.sin(ph)) * .05 : 0;
  const sq = walk >= 0 ? Math.sin(ph * 2) * .03 : 0, B = ud.base ?? JS; ud.body.scale.set(B * (1 + sq), B * (1 - sq), B); if (ud.clay) ud.body.rotation.z = walk >= 0 ? Math.sin(ph) * .09 : 0;
  ud.legs.forEach((lg, i) => lg.rotation.x = walk >= 0 ? Math.sin(ph + i * Math.PI) * .55 : 0);
  ud.arms.forEach((ar, i) => ar.rotation.x = walk >= 0 ? Math.sin(ph + i * Math.PI + Math.PI) * .45 : 0);
  PR.r.setSize(w, h, false);
  const c = PR.cam; c.aspect = w / h;
  const fy = look && look.species && look.species !== 'jelly' ? .6 : .55;
  if (mode === 'head') { c.fov = 30; c.position.set(0, fy + .11, 1.75); c.lookAt(0, fy, 0); }
  else { c.fov = 26; const fit = Math.max(1, (h / w) * .62); c.position.set(0, .8, 2.9 * fit); c.lookAt(0, .5, 0); }
  c.updateProjectionMatrix();
  PR.r.render(PR.scene, c); PR.scene.remove(o);
  return PR.r.domElement;
}
function prBitmap(look, w, h, mode){
  const k = mode + w + 'x' + h + JSON.stringify(look || {});
  let b = PR.bmp.get(k); if (b) return b;
  const src = prRender(look, w, h, mode); if (!src) return null;
  b = document.createElement('canvas'); b.width = w; b.height = h; b.getContext('2d').drawImage(src, 0, 0);
  PR.bmp.set(k, b); if (PR.bmp.size > 60) PR.bmp.delete(PR.bmp.keys().next().value);
  return b;
}
function fitCanvas(c, w, h){ if (c.width !== w || c.height !== h) { c.width = w; c.height = h; c.classList.remove('px'); } }

function avatarCanvas(look){
  const c = document.createElement('canvas'); fitCanvas(c, 56, 48);
  const b = prBitmap(look, 56, 48, 'head'); if (b) c.getContext('2d').drawImage(b, 0, 0); return c;
}
function paintAvatar(c, look){
  fitCanvas(c, 68, 58); const g = c.getContext('2d'); g.clearRect(0, 0, 68, 58);
  const b = prBitmap(look, 68, 58, 'head'); if (b) g.drawImage(b, 0, 0);
}
function drawPreviewFront(){
  const c = $('preview'); fitCanvas(c, 240, 330); const g = c.getContext('2d'); g.clearRect(0, 0, 240, 330);
  const src = prRender(draft, 240, 330, 'full', 0); if (src) g.drawImage(src, 0, 0);
}
function previewTick(i){
  if (i % 5 === 0) drawPreviewFront();
  const c = $('previewSpin'); fitCanvas(c, 170, 234); const g = c.getContext('2d'); g.clearRect(0, 0, 170, 234);
  const t = i * PREVIEW_MS / 1000;
  const src = prRender(draft, 170, 234, 'full', t * 1.1, (Math.floor(t / 3) % 2) ? t * 9 : -1); if (src) g.drawImage(src, 0, 0);
}
function drawFamily(now){
  if (now - lastFam < 60) return; lastFam = now;
  const c = $('family'); fitCanvas(c, 700, 190);
  const g = c.getContext('2d'); g.clearRect(0, 0, 700, 190);
  const ids = Object.keys(loginUsers).sort((a, b) => (loginUsers[a].created || 0) - (loginUsers[b].created || 0));
  for (let i = 0; i < MAX_USERS; i++) {
    const x = i * 100, id = ids[i];
    g.fillStyle = 'rgba(60,35,15,.18)'; g.beginPath(); g.ellipse(x + 50, 176, 26, 6, 0, 0, 7); g.fill();
    const b = prBitmap(id ? loginUsers[id].look : DEFAULT_LOOK, 120, 180, 'full'); if (!b) continue;
    const hop = id ? Math.max(0, Math.sin(now / 260 + i * 1.7)) ** 6 * 10 : 0;
    g.globalAlpha = id ? 1 : .22; g.drawImage(b, x - 10, 2 - hop); g.globalAlpha = 1;
  }
}

/* ---------- 캐릭터 꾸미기: 종류(곰·토끼·고양이·사람·젤리) ---------- */
function randomJelly(){
  const P = a => a[Math.floor(Math.random() * a.length)];
  const sp = (draft && draft.species) || 'jelly';
  const base = Object.assign(randomLook(), { species: sp, eyes: P(EYES)[0], mouth: P(['smile','cat','small','none','open']), blush: Math.random() < .75 });
  if (sp === 'jelly') return Object.assign(base, { jelly: P(JELLY_COLORS), deco: P(DECOS.slice(0, 12))[0], decoColor: P(DECO_COLORS), outfit: P(OUTFITS)[0], outfitColor: P(OUTFIT_COLORS), acc: Math.random() < .5 ? 'none' : P(ACCS)[0] });
  return Object.assign(base, { fur: P(FUR_COLORS), kidSkin: P(KID_SKINS), kidHair: P(KID_HAIRS)[0], hairColor: P(HAIR_COLORS), outfit: P(CLAY_OUTFITS.slice(1))[0], outfitColor: P(OUTFIT_COLORS), bottom2: sp === 'kid' ? P(CLAY_BOTTOMS.slice(1))[0] : (Math.random() < .6 ? 'none' : P(CLAY_BOTTOMS)[0]), bottomColor: P(OUTFIT_COLORS), neck: Math.random() < .5 ? 'none' : P(CLAY_NECKS.slice(1))[0], neckColor: P(NECK_COLORS), acc: Math.random() < .5 ? 'none' : P(CLAY_ACCS)[0] });
}
function buildLookUI(){
  draft = draft || {};
  if (!draft.species) draft.species = 'jelly';
  const sp = draft.species, isJelly = sp === 'jelly';
  draft = isJelly ? jellyLook(draft) : clayLook(draft);
  if (!isJelly && !CLAY_OUTFITS.some(([v]) => v === draft.outfit)) draft.outfit = 'none';
  if (isJelly && !OUTFITS.some(([v]) => v === draft.outfit)) draft.outfit = 'band';
  const box = $('lookOpts'); box.innerHTML = '';
  drawPreviewFront();
  const addRow = (label, el) => { const r = document.createElement('div'); r.className = 'row'; const l = document.createElement('label'); l.textContent = label; r.append(l, el); box.appendChild(r); };
  const swatches = (key, list) => { const w = document.createElement('div'); w.className = 'chips'; list.forEach(c => { const b = document.createElement('button'); b.className = 'sw' + (draft[key] === c ? ' sel' : ''); b.style.background = c; b.onclick = () => { draft[key] = c; buildLookUI(); }; w.appendChild(b); }); return w; };
  const chips = (key, list, after) => { const w = document.createElement('div'); w.className = 'chips'; list.forEach(([v, n]) => { const b = document.createElement('button'); b.textContent = n; if (draft[key] === v) b.classList.add('on'); b.onclick = () => { draft[key] = v; if (after) after(v); buildLookUI(); }; w.appendChild(b); }); return w; };
  const T = { '종류':'🐾 종류·색', '얼굴':'🙂 얼굴', '머리':'💇 머리', '옷':'👕 옷', '소품':'🎀 소품' };
  const tabsOn = Object.keys(T).filter(t => t !== '머리' || sp === 'kid' || isJelly);
  if (!tabsOn.includes(lookTab)) lookTab = '종류';
  const tabs = document.createElement('div'); tabs.className = 'look-tabs';
  tabsOn.forEach(t => { const b = document.createElement('button'); b.textContent = T[t]; if (t === lookTab) b.classList.add('on'); b.onclick = () => { lookTab = t; buildLookUI(); }; tabs.appendChild(b); });
  box.appendChild(tabs);
  if (lookTab === '종류') {
    addRow('종류', chips('species', SPECIES, v => { if (v !== 'jelly' && v !== 'kid') draft.fur = { bear: '#b88356', bunny: '#fbf7f2', cat: '#f3b067' }[v]; }));
    if (isJelly) addRow('젤리 색', swatches('jelly', JELLY_COLORS));
    else if (sp === 'kid') addRow('피부', swatches('kidSkin', KID_SKINS));
    else addRow('털색', swatches('fur', FUR_COLORS));
  } else if (lookTab === '얼굴') {
    addRow('눈', chips('eyes', EYES));
    addRow('입', chips('mouth', MOUTHS));
    addRow('볼터치', chips('blush', [[true,'있음'],[false,'없음']]));
  } else if (lookTab === '머리') {
    if (isJelly) { addRow('장식', chips('deco', DECOS)); addRow('장식 색', swatches('decoColor', DECO_COLORS)); }
    else { addRow('머리', chips('kidHair', KID_HAIRS)); addRow('머리색', swatches('hairColor', HAIR_COLORS)); }
  } else if (lookTab === '옷') {
    if (isJelly) { addRow('옷', chips('outfit', OUTFITS)); addRow('옷 색', swatches('outfitColor', OUTFIT_COLORS)); }
    else {
      addRow('상의', chips('outfit', CLAY_OUTFITS)); addRow('상의 색', swatches('outfitColor', OUTFIT_COLORS));
      addRow('하의', chips('bottom2', CLAY_BOTTOMS)); addRow('하의 색', swatches('bottomColor', OUTFIT_COLORS));
      if (sp === 'kid') addRow('신발', swatches('shoes', SHOES));
    }
  } else {
    addRow(isJelly ? '소품' : '머리', chips('acc', isJelly ? ACCS : CLAY_ACCS));
    if (!isJelly) { addRow('목', chips('neck', CLAY_NECKS)); addRow('목 소품 색', swatches('neckColor', NECK_COLORS)); }
  }
  if (!isJelly) { const n = document.createElement('div'); n.className = 'muted'; n.style.marginTop = '4px'; n.textContent = '처음 고를 때는 캐릭터를 빚느라 잠깐 멈칫할 수 있어요.'; box.appendChild(n); }
}
