<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>칠복이네</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --ink:#3f2b1f; --ink2:#6b4f3a; --cream:#fffaf0; --paper:#f6e4c4; --line:#e7d3b0;
  --accent:#ef7d57; --accent-d:#c95f3d; --mint:#6cbf96; --sky:#8fc9e8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1c14;font-family:'Galmuri11','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.box{background:linear-gradient(180deg,#fffdf7 0%,#fbf0da 100%);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink),0 12px 28px rgba(20,10,4,.35)}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);white-space:nowrap;transition:transform .06s,box-shadow .06s,background .15s}
button:hover{background:#fbe9cd}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
button.primary{background:var(--accent);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#f48f6c}
button.small{font-size:11px;padding:4px 8px;box-shadow:0 2px 0 var(--ink)}
button.danger{background:#f7d6cd}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:2px solid var(--ink2);border-radius:8px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(239,125,87,.2)}
.hidden{display:none!important}

#hud-tl{position:fixed;left:14px;top:14px;padding:12px 14px 10px;width:230px;font-size:12px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:2px dashed var(--line)}
.brand canvas{width:32px;height:32px}
.brand .t{font-family:'Galmuri14','Galmuri11',sans-serif;font-size:17px;font-weight:bold;letter-spacing:1px}
.brand .s{font-size:10px;opacity:.6;margin-top:2px}
#online .who{display:flex;gap:7px;align-items:center;padding:3px 4px;border-radius:6px;white-space:nowrap;overflow:hidden}
#online .who:hover{background:rgba(239,125,87,.08)}
#online .who canvas{width:28px;height:24px;flex:none;background:#f3e3c6;border-radius:6px}
#online .who .nm{font-weight:bold;overflow:hidden;text-overflow:ellipsis}
#online .who .where{opacity:.5;font-size:10px;overflow:hidden;text-overflow:ellipsis}
#online .who .col{display:flex;flex-direction:column;min-width:0;line-height:1.35}
#online .foot{margin-top:6px;font-size:10px;opacity:.55;text-align:right}

#toolbar{position:fixed;right:14px;top:14px;display:flex;align-items:stretch;gap:2px;padding:5px}
.tb{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:50px;padding:5px 6px 4px;font-size:10px;background:transparent;border:none;box-shadow:none;border-radius:8px;position:relative}
.tb .i{font-size:18px;line-height:22px}
.tb:hover{background:#f6e2c0}
.tb:active{transform:translateY(1px);box-shadow:none}
.tb.on{background:var(--accent);color:#fff}
.sep{width:2px;margin:6px 3px;background:var(--line);border-radius:2px}
.badge{position:absolute;top:1px;right:5px;min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:8px;background:#e8574f;color:#fff;font-size:10px;font-weight:bold;box-shadow:0 0 0 2px #fff}

#chatbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(600px,calc(100vw - 28px));padding:8px}
#emotes{display:flex;gap:4px;margin-bottom:6px}
#emotes button{flex:1;padding:3px 0;font-size:17px;background:#fff;border:2px solid var(--line);box-shadow:none;border-radius:8px}
#emotes button:hover{border-color:var(--accent);background:#fff5ef;transform:translateY(-2px)}
.inrow{display:flex;gap:6px;align-items:center}
.inrow input{flex:1;min-width:0}
#meAvatar{width:34px;height:29px;flex:none;background:#f3e3c6;border:2px solid var(--line);border-radius:8px}

#log{position:fixed;right:14px;top:90px;width:280px;max-height:calc(100vh - 250px);overflow:auto;padding:10px 12px;font-size:12px;display:none}
#log.show{display:block}
#log h3{margin:0 0 6px;font-size:13px}
#log .m{padding:6px 2px;border-bottom:1px dashed var(--line);word-break:break-all;-webkit-user-select:text;user-select:text;line-height:1.5}
#log .m b{margin-right:5px;color:var(--accent-d)}
#log .m time{opacity:.4;font-size:10px;margin-left:5px}

#palette{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);width:min(700px,calc(100vw - 28px));padding:10px;display:none}
#palette.show{display:block}
#tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
#tabs button{padding:5px 10px;font-size:12px;box-shadow:none;border-radius:20px;background:#fff;border-color:var(--line)}
#tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;max-height:150px;overflow:auto;padding:2px}
.it{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px 5px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-size:10px;background:#fff;text-align:center;transition:transform .08s,border-color .1s}
.it:hover{transform:translateY(-2px);border-color:#d9b98c}
.it .ic{font-size:24px;line-height:30px;height:30px;display:flex;align-items:center;justify-content:center}
.it.sel{border-color:var(--accent);background:#fff1ea;box-shadow:0 0 0 2px rgba(239,125,87,.25)}
.it canvas{width:30px;height:30px}
#hint{font-size:11px;margin-top:8px;opacity:.75;line-height:1.5}

.modal-bg{position:fixed;inset:0;background:rgba(30,18,10,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
.modal-bg.show{display:flex}
.modal{padding:20px;width:min(450px,100%);max-height:calc(100vh - 28px);overflow:auto}
.modal.wide{width:min(640px,100%)}
.modal h2{margin:0 0 12px;font-size:17px;font-family:'Galmuri14','Galmuri11',sans-serif}
.row{display:flex;gap:8px;align-items:center;margin:9px 0;flex-wrap:wrap}
.row>label{width:60px;font-size:12px;flex:none;opacity:.8}
.err{color:#c0392b;font-size:12px;min-height:16px;margin-top:6px;line-height:1.5}
.sw{width:26px;height:26px;border:2px solid var(--ink);border-radius:7px;cursor:pointer;padding:0;box-shadow:none}
.sw:hover{transform:scale(1.1)}
.sw.sel{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chips button{padding:4px 9px;font-size:12px;box-shadow:none;border-radius:20px;background:#fff;border-color:var(--line)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.preview-wrap{display:flex;gap:14px;align-items:center;background:linear-gradient(#cfe8f5,#e9f4fa 60%,#a8d48a 60%,#93c574);border:2px solid var(--ink);border-radius:12px;padding:10px 16px;margin-bottom:6px}
#preview{width:84px;height:120px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:middle}
td select{font-size:12px;padding:4px}
.sec{margin:18px 0 8px;font-size:13px;font-weight:bold;border-top:2px solid var(--line);padding-top:12px}
.muted{font-size:11px;opacity:.65;line-height:1.55}

#loginModal{background:radial-gradient(ellipse at center,rgba(42,28,20,.15) 0%,rgba(42,28,20,.7) 100%)}
.login-card{padding:24px 24px 20px;width:min(410px,100%)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo canvas{width:48px;height:48px}
.logo h1{margin:0;font-family:'Galmuri14','Galmuri11',sans-serif;font-size:28px;letter-spacing:2px;line-height:1}
.logo .sub{font-size:11px;opacity:.6;margin-top:6px}
.family{background:linear-gradient(#d7eef9,#eef7fb 62%,#a8d48a 62%,#93c574);border:2px solid var(--ink);border-radius:12px;padding:8px 6px 4px;margin-bottom:10px;text-align:center}
#family{width:100%;max-width:350px;height:auto;aspect-ratio:112/26}
.newbox{background:#fff;border:2px dashed var(--accent);border-radius:10px;padding:12px;margin-top:10px;font-size:12px;line-height:1.6}

.board-modal{width:min(520px,100%);background:linear-gradient(180deg,#fffdf7,#fbf0da)}
.board-write{background:#c99a62;border:3px solid #7a4e2d;border-radius:10px;padding:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.board-write textarea{width:100%;font:inherit;font-size:13px;color:var(--ink);background:#fffdf3;border:2px solid #7a4e2d;border-radius:6px;padding:8px 10px;resize:vertical;outline:none}
.board-write .muted{color:#fff;opacity:.85}
#boardList{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.note{position:relative;background:#fff8c9;border:2px solid #e3cf7a;border-radius:4px;padding:10px 12px 8px;box-shadow:2px 3px 0 rgba(63,43,31,.15);font-size:13px;line-height:1.55;word-break:break-all;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.note:nth-child(3n+2){background:#e4f4ff;border-color:#a9d3ef}
.note:nth-child(3n){background:#ffe8ef;border-color:#f1b5c7}
.note.pinned{background:#fff1d6;border-color:var(--accent);box-shadow:0 0 0 2px rgba(239,125,87,.25),2px 3px 0 rgba(63,43,31,.15)}
.note .meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;opacity:.75;white-space:normal}
.note .meta b{color:var(--accent-d)}
.note .meta .sp{flex:1}
.note .pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:16px}
#demo{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#ffe08a;padding:6px 12px;font-size:11px;display:none;z-index:15;max-width:56vw;text-align:center;border-radius:10px}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  #hud-tl{width:auto;max-width:44vw;padding:8px 10px;font-size:11px}
  #online .who canvas{display:none}
  .brand .s{display:none}
  #toolbar{max-width:52vw;flex-wrap:wrap;justify-content:flex-end}
  .tb{min-width:38px;font-size:0;padding:5px 4px}
  .tb .i{font-size:17px}
  .sep{display:none}
  #log{width:calc(100vw - 28px);top:auto;bottom:130px}
  #palette{bottom:120px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="demo" class="box"></div>

<div id="hud-tl" class="box hidden">
  <div class="brand"><canvas id="brandIcon" class="px" width="16" height="16"></canvas><div><div class="t">칠복이네</div><div class="s" id="clock"></div></div></div>
  <div id="online"></div>
</div>

<div id="toolbar" class="box hidden">
  <button class="tb" id="bLook" title="캐릭터 꾸미기"><span class="i">😊</span>캐릭터</button>
  <button class="tb" id="bEdit" title="집 꾸미기 (E)"><span class="i">🎨</span>꾸미기</button>
  <button class="tb" id="bLog" title="대화 기록"><span class="i">💬</span>대화<span id="unread"></span></button>
  <button class="tb" id="bBoard" title="거실 게시판"><span class="i">📌</span>게시판<span id="boardBadge"></span></button>
  <span class="sep"></span>
  <button class="tb" id="bMyRoom" title="내 방으로 이동"><span class="i">🛏️</span>내 방</button>
  <button class="tb" id="bLiving" title="거실로 이동"><span class="i">🛋️</span>거실</button>
  <span class="sep"></span>
  <button class="tb" id="bZoomOut" title="축소"><span class="i">➖</span>축소</button>
  <button class="tb" id="bZoomIn" title="확대"><span class="i">➕</span>확대</button>
  <button class="tb" id="bFit" title="집 전체 보기"><span class="i">🗺️</span>전체</button>
  <span class="sep"></span>
  <button class="tb hidden" id="bAdmin" title="관리자"><span class="i">👑</span>관리</button>
  <button class="tb" id="bOut" title="나가기"><span class="i">🚪</span>나가기</button>
</div>

<div id="log" class="box"></div>

<div id="palette" class="box">
  <div id="tabs"></div>
  <div id="items"></div>
  <div id="hint"></div>
</div>

<div id="chatbar" class="box hidden">
  <div id="emotes"></div>
  <div class="inrow">
    <canvas id="meAvatar" class="px" width="14" height="12"></canvas>
    <input id="chatIn" maxlength="120" placeholder="Enter 눌러서 말하기 · 방향키/WASD 이동 · 바닥 클릭으로도 이동" autocomplete="off">
    <button id="bSend" class="primary">전송</button>
  </div>
</div>

<div id="loginModal" class="modal-bg show">
  <div class="modal box login-card">
    <div class="logo"><canvas id="logoHouse" class="px" width="16" height="16"></canvas><div><h1>칠복이네</h1><div class="sub">일곱 명의 복 있는 집에 오신 걸 환영해요</div></div></div>
    <div class="family"><canvas id="family" class="px" width="112" height="26"></canvas></div>
    <div class="muted" id="slotInfo">집 문 여는 중…</div>
    <div class="row"><label>아이디</label><input id="inId" maxlength="12" placeholder="영문/한글/숫자 2~12자" style="flex:1"></div>
    <div class="row"><label>비밀번호</label><input id="inPin" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" style="flex:1"></div>
    <div id="newBox" class="newbox hidden">
      <span id="newMsg"></span>
      <div class="row" style="margin-bottom:0"><button id="bCreate" class="primary">새로 만들기</button><button id="bCancelNew">다시 입력</button></div>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="row" style="margin-bottom:0"><button id="bLogin" class="primary" style="flex:1;padding:11px">🏠 집에 들어가기</button></div>
  </div>
</div>

<div id="lookModal" class="modal-bg">
  <div class="modal box">
    <h2>😊 내 캐릭터 · 닉네임</h2>
    <div class="preview-wrap">
      <canvas id="preview" class="px" width="14" height="20"></canvas>
      <div class="muted" style="opacity:.8">저장하면 다음에 들어와도 그대로 남아요.<br>어느 기기에서 들어와도 같은 캐릭터예요.</div>
    </div>
    <div class="row"><label>닉네임</label><input id="inNick" maxlength="10" placeholder="화면에 보일 이름 (최대 10자)" style="flex:1"></div>
    <div class="muted" style="margin:-4px 0 4px 68px">이모지·띄어쓰기도 돼요. 비워두면 아이디가 보여요.</div>
    <div id="lookOpts"></div>
    <div class="row" style="justify-content:space-between;margin-bottom:0">
      <button id="bRandom">🎲 랜덤</button>
      <span><button id="bLookCancel">닫기</button> <button id="bLookSave" class="primary">저장</button></span>
    </div>
  </div>
</div>

<div id="boardModal" class="modal-bg">
  <div class="modal box board-modal">
    <div class="row" style="justify-content:space-between;margin-top:0"><h2 style="margin:0">📌 거실 게시판</h2><button id="bBoardClose">닫기</button></div>
    <div class="muted" style="margin-bottom:8px">누구나 글을 남길 수 있어요. 내 글은 내가 지울 수 있고, 📍 고정은 관리자만 할 수 있어요.</div>
    <div class="board-write">
      <textarea id="boardIn" maxlength="300" rows="3" placeholder="공지, 약속, 하고 싶은 말을 남겨 보세요 (최대 300자)"></textarea>
      <div class="row" style="justify-content:space-between;margin:6px 0 0"><span class="muted" id="boardCount">0/300</span><button id="bBoardPost" class="primary">📝 올리기</button></div>
    </div>
    <div id="boardList"></div>
  </div>
</div>

<div id="adminModal" class="modal-bg">
  <div class="modal box wide">
    <div class="row" style="justify-content:space-between;margin-top:0"><h2 style="margin:0">👑 관리자</h2><button id="bAdminClose">닫기</button></div>
    <div id="adminBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =====================================================================
   설정 — 여기 두 군데만 바꾸면 됩니다
   ===================================================================== */

// 1) Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) 에서 복사한 값을 붙여넣으세요.
//    비워두면 "체험 모드"로 이 브라우저 안에서만 동작합니다(탭 여러 개로 테스트 가능).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC2ZCYOzhawH_a7v-g7E2POa5muGZrBd1k",
  authDomain: "bok-house.firebaseapp.com",
  databaseURL: "https://bok-house-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bok-house",
  storageBucket: "bok-house.firebasestorage.app",
  messagingSenderId: "1052603310488",
  appId: "1:1052603310488:web:10bd4356d2735949ae4bed"
};

// 2) 관리자 아이디 (이 아이디로 가입한 사람만 관리자 기능을 씁니다)
const ADMIN_ID = "lily";

const MAX_USERS = 7;

/* ===================================================================== */

const FONT = '"Galmuri11","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const $ = id => document.getElementById(id);
const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));

/* ---------------- 저장소 (Firebase / 체험 모드) ---------------- */
function loadScript(src){
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('스크립트 로드 실패: ' + src)); document.head.appendChild(s); });
}
async function makeFirebaseStore(){
  const V = '10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  return {
    mode: 'firebase',
    set: (p, v) => db.ref(p).set(v),
    remove: p => db.ref(p).remove(),
    update: o => db.ref().update(o),
    get: p => Promise.race([
      db.ref(p).once('value').then(s => s.val()),
      new Promise((_, no) => setTimeout(() => no(new Error('TIMEOUT')), 8000)),
    ]),
    on: (p, cb) => { const r = db.ref(p), h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    onDisconnectRemove: p => db.ref(p).onDisconnect().remove(),
    onConnected: cb => db.ref('.info/connected').on('value', s => cb(!!s.val())),
  };
}
function makeLocalStore(){
  const KEY = 'our-house-demo-v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) {}
  const subs = [];
  let bc = null; try { bc = new BroadcastChannel(KEY); } catch(e) {}
  const parts = p => p.split('/').filter(Boolean);
  const getIn = p => { let o = data; for (const k of parts(p)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; };
  const setIn = (p, v) => {
    const ks = parts(p); let o = data; const stack = [];
    for (let i = 0; i < ks.length - 1; i++) {
      if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') { if (v == null) return; o[ks[i]] = {}; }
      stack.push([o, ks[i]]); o = o[ks[i]];
    }
    const last = ks[ks.length - 1];
    if (v == null) {

/* ---------------- 이동 ---------------- */
const DIRV = { u:[0,-1], d:[0,1], l:[-1,0], r:[1,0] };
const held = [];
let lastSentDir = null;
function heldDir(){ return held.length ? held[held.length - 1] : null; }
function sendPresence(){ if (!me) return; lastSentDir = me.d; Store.set('presence/' + me.id, { x: me.x, y: me.y, d: me.d, t: Date.now() }); }
function tryStep(d, now){
  const [vx, vy] = DIRV[d]; me.d = d;
  const nx = me.x + vx, ny = me.y + vy;
  if (walkable(nx, ny)) { me.fx = me.x; me.fy = me.y; me.x = nx; me.y = ny; me.ms = now; me.moving = true; sendPresence(); return true; }
  if (lastSentDir !== d) sendPresence();
  return false;
}
function teleport(x, y){ me.x = me.fx = x; me.y = me.fy = y; me.dx = x; me.dy = y; me.moving = false; me.path = []; me.d = 'd'; sendPresence(); }
function findPath(tx, ty){
  if (!walkable(tx, ty)) return null;
  const sx = me.x, sy = me.y, prev = new Map(), q = [[sx, sy]]; prev.set(tileKey(sx, sy), null);
  while (q.length) {
    const [x, y] = q.shift();
    if (x === tx && y === ty) { const path = []; let k = tileKey(x, y); while (k && k !== tileKey(sx, sy)) { const [a, b] = k.split('_').map(Number); path.unshift([a, b]); k = prev.get(k); } return path; }
    for (const [vx, vy] of Object.values(DIRV)) { const nx = x + vx, ny = y + vy, k = tileKey(nx, ny); if (!prev.has(k) && walkable(nx, ny)) { prev.set(k, tileKey(x, y)); q.push([nx, ny]); } }
  }
  return null;
}
function update(now, dt){
  if (me) {
    if (me.moving) {
      const p = (now - me.ms) / STEP_MS;
      if (p >= 1) { me.moving = false; me.dx = me.x; me.dy = me.y; }
      else { me.dx = me.fx + (me.x - me.fx) * p; me.dy = me.fy + (me.y - me.fy) * p; }
    }
    if (!me.moving) {
      const d = heldDir();
      if (d) { me.path = []; tryStep(d, now); }
      else if (me.path.length) {
        const [nx, ny] = me.path.shift();
        const d2 = nx > me.x ? 'r' : nx < me.x ? 'l' : ny > me.y ? 'd' : 'u';
        if (!tryStep(d2, now)) me.path = [];
      }
      if (me.moving) { const p = (now - me.ms) / STEP_MS; me.dx = me.fx + (me.x - me.fx) * p; me.dy = me.fy + (me.y - me.fy) * p; }
    }
  }
  const tnow = Date.now();
  for (const id in others) {
    const o = others[id];
    o.visible = tnow - o.seen < STALE_MS;
    const ddx = o.x - o.dx, ddy = o.y - o.dy, dist = Math.hypot(ddx, ddy);
    if (dist > 4) { o.dx = o.x; o.dy = o.y; }
    else if (dist > 0.001) { const s = Math.min(1, (dt / STEP_MS) / dist); o.dx += ddx * s; o.dy += ddy * s; }
    o.step = dist > 0.02 ? (Math.floor(now / 110) % 2) + 1 : 0;
  }
}

function loop(now){ const dt = Math.min(100, now - lastT); lastT = now; update(now, dt); draw(now); if (!me) drawFamily(now); requestAnimationFrame(loop); }

    g.fillStyle = 'rgba(30,60,10,.25)'; g.beginPath(); g.ellipse(x + 7, 23, 5, 1.4, 0, 0, 7); g.fill();

    } else g.drawImage(spriteImg(DEFAULT_LOOK, 'd', 0, true), x, 4);

}

async function sha(s){
  if (crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h;
}
function explainError(e){
  const m = String(e && (e.code || e.message) || e);
  console.error('[칠복이네]', e);
  if (/permission/i.test(m)) return '❌ Firebase가 접근을 막았어요. Realtime Database → 규칙 탭에 규칙을 붙여넣고 "게시"를 눌렀는지 확인해 주세요.';
  if (/TIMEOUT/.test(m)) return '❌ 데이터베이스에 연결이 안 돼요. FIREBASE_CONFIG의 databaseURL이 Realtime Database 화면 위쪽 주소와 똑같은지 확인해 주세요.';
  return '❌ 연결 오류: ' + m;
}
const pinHash = (id, pin) => sha('our-house:' + id + ':' + pin);

/* ---------------- 로그인 ---------------- */
const ID_RE = /^[a-zA-Z0-9가-힣_]{2,12}$/;
let pendingNew = null;
async function refreshSlots(){
  let u;
  try { u = await Store.get('users') || {}; } catch (e) { $('slotInfo').textContent = ''; $('loginErr').textContent = explainError(e); return; }
  loginUsers = u;
  const n = Object.keys(u).length;
  $('slotInfo').textContent = n >= MAX_USERS ? `가족 ${n}/${MAX_USERS}명 · 자리가 다 찼어요 (기존 아이디로만 입장 가능)` : `가족 ${n}/${MAX_USERS}명 · 처음이면 원하는 아이디와 숫자 4자리를 정해서 들어오세요.`;
}
async function tryLogin(){
  const id = $('inId').value.trim(), pin = $('inPin').value.trim(), err = $('loginErr');
  err.textContent = ''; $('newBox').classList.add('hidden');
  if (!ID_RE.test(id)) return err.textContent = '아이디는 영문/한글/숫자 2~12자로 해 주세요.';
  if (!/^\d{4}$/.test(pin)) return err.textContent = '비밀번호는 숫자 4자리예요.';
  const h = await pinHash(id, pin);
  const u = await Store.get('users/' + id);
  if (u) { if (u.pin !== h) return err.textContent = '비밀번호가 맞지 않아요.'; return enter(id, h, false); }
  const all = await Store.get('users') || {};
  if (Object.keys(all).length >= MAX_USERS) return err.textContent = `가족 ${MAX_USERS}명이 다 찼어요. 아이디를 다시 확인해 주세요.`;
  pendingNew = { id, h };
  $('newMsg').textContent = `"${id}"는 처음 보는 아이디예요. 이 아이디와 비밀번호로 새로 만들까요? 비밀번호는 잊지 않게 기억해 두세요.`;
  $('newBox').classList.remove('hidden');
}
async function createUser(){
  if (!pendingNew) return;
  const { id, h } = pendingNew; pendingNew = null; $('newBox').classList.add('hidden');
  const all = await Store.get('users') || {};
  if (all[id]) return $('loginErr').textContent = '방금 누가 같은 아이디를 만들었어요. 다시 시도해 주세요.';
  if (Object.keys(all).length >= MAX_USERS) return $('loginErr').textContent = '자리가 다 찼어요.';
  const used = new Set(Object.values(all).map(x => x.room));
  let room = id === ADMIN_ID && !used.has(0) ? 0 : ROOMS.map(r => r.i).find(i => !used.has(i));
  await Store.set('users/' + id, { pin: h, room: room ?? -1, look: randomLook(), created: Date.now() });
  enter(id, h, true);
}
const safe = fn => async () => { try { await fn(); } catch (e) { $('loginErr').textContent = explainError(e); } };
$('bLogin').onclick = safe(tryLogin);

let subscribed = false;
async function enter(id, h, isNew){
  try { sess().setItem('our-house-session', JSON.stringify({ id, h })); } catch(e) {}
  isAdmin = id === ADMIN_ID;
  users = await Store.get('users') || {};
  const room = users[id]?.room ?? -1;
  const [sx, sy] = room >= 0 ? roomCenter(room) : LIVING_SPOT;
  me = { id, x: sx, y: sy, fx: sx, fy: sy, dx: sx, dy: sy, d:'d', moving:false, ms:0, path:[] };
  $('loginModal').classList.remove('show');
  ['hud-tl','toolbar','chatbar'].forEach(x => $(x).classList.remove('hidden'));
  $('bAdmin').classList.toggle('hidden', !isAdmin);
  subscribe();
  Store.onConnected(c => { if (c && me) { Store.onDisconnectRemove('presence/' + me.id); sendPresence(); } });
  setInterval(sendPresence, 10000);
  setInterval(renderOnline, 1000); renderOnline();
  layerDirty = true;
  if (isNew) { openLook(); toast(`🎉 환영해요, ${id}님! ${room >= 0 ? (room + 1) + '번 방이 내 방이에요.' : ''}`); }
  else toast(`🏠 어서 와요, ${nick(id)}님!`);
}
function subscribe(){
  if (subscribed) return; subscribed = true;
  Store.on('users', v => {
    users = v || {}; layerDirty = true;
    if (me && !users[me.id]) { alert('계정이 삭제되었어요.'); try { sess().removeItem('our-house-session'); } catch(e) {} location.reload(); return; }
    if ($('adminModal').classList.contains('show') && !document.activeElement?.closest?.('#adminModal')) renderAdmin();
    if (editing) buildPalette();
  });
  Store.on('presence', v => {
    presence = v || {}; const now = Date.now();
    for (const id in presence) {
      if (id === me.id) continue;
      const p = presence[id]; if (!p) continue;
      let o = others[id];
      if (!o) o = others[id] = { id, x: p.x, y: p.y, dx: p.x, dy: p.y, d: p.d || 'd', step: 0, seen: now, t: p.t, visible: true };
      if (o.t !== p.t || o.x !== p.x || o.y !== p.y) o.seen = now;
      o.x = p.x; o.y = p.y; o.d = p.d || 'd'; o.t = p.t;
    }
    for (const id in others) if (!presence[id]) delete others[id];
  });
  Store.on('furniture', v => { furniture = v || {}; layerDirty = true; });
  Store.on('rugs', v => { rugs = v || {}; layerDirty = true; });
  Store.on('tiles', v => { tiles = v || {}; layerDirty = true; });
  Store.on('roomNames', v => { roomNames = v || {}; layerDirty = true; });
  Store.on('chat', onChat);
  Store.on('notices', v => {
    const before = notices; notices = v || {}; layerDirty = true; renderBoardBadge();
    if ($('boardModal').classList.contains('show')) { renderBoard(); markBoardSeen(); }
    for (const k in notices) if (!before[k] && notices[k] && notices[k].id !== me.id && Object.keys(before).length) toast(`📌 ${nick(notices[k].id)}님이 게시판에 새 글을 올렸어요`);
  });
  if (isAdmin) Store.on('backups', v => { backups = v || {}; if ($('adminModal').classList.contains('show')) renderAdmin(); });
}

/* ---------------- 시작 ---------------- */
(async function start(){
  const hasFb = FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL;
  try { Store = hasFb ? await makeFirebaseStore() : makeLocalStore(); }
  catch (e) { console.error(e); Store = makeLocalStore(); toast('Firebase 연결에 실패해서 체험 모드로 열었어요: ' + (e.message || e)); }
  if (Store.mode === 'local') { const d = $('demo'); d.textContent = '체험 모드 · Firebase를 연결하기 전이라 이 브라우저 안에서만 보여요 (탭을 여러 개 열어 테스트해 보세요)'; d.style.display = 'block'; setTimeout(() => d.style.display = 'none', 9000); }
  if (document.fonts) document.fonts.ready.then(() => { layerDirty = true; });
  requestAnimationFrame(loop);
  refreshSlots();
  try {
    const s = JSON.parse(sess().getItem('our-house-session') || 'null');
    if (s && s.id) { const u = await Store.get('users/' + s.id); if (u && u.pin === s.h) return enter(s.id, s.h, false); }
  } catch(e) {}
  $('inId').focus();
})();
